services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/var/www/html:cached
    ports:
      - "80:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: tati_pizzas
      DB_USER: tati_dev
      DB_PASSWORD: tati_dev_local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tati_pizzas
      MYSQL_USER: tati_dev
      MYSQL_PASSWORD: tati_dev_local
      MYSQL_ROOT_PASSWORD: tati_root_dev_local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptati_root_dev_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
